<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}LoadCoach{% endblock %}</title>
  {# Plain, pre-MirrorWall (dev-plan P2): deliberately no design tokens, no theme switcher — that
     lands with MirrorWall's Phase 4 extraction. Just enough to read the data. #}
  <style>
    body { font-family: system-ui, sans-serif; margin: 0 auto; max-width: 72rem;
           padding: 0 1.5rem 3rem; line-height: 1.5; font-size: 14px; color: #111; }
    header { border-bottom: 1px solid #ccc; margin-bottom: 1rem; }
    h1 { font-size: 20px; margin: 1rem 0 0.5rem; }
    nav ul { display: flex; gap: 1rem; list-style: none; padding: 0; margin: 0 0 0.5rem; }
    nav a { text-decoration: none; color: #06c; }
    table { border-collapse: collapse; width: 100%; font-size: 13px; }
    th, td { border-bottom: 1px solid #ddd; padding: 0.4rem 0.6rem; text-align: left; vertical-align: top; }
    thead th { background: #f4f4f4; }
    .muted { color: #666; }
    .mono { font-family: ui-monospace, monospace; }
    .empty-state { border: 1px dashed #ccc; padding: 1rem; margin-top: 1rem; }
    .badge { border: 1px solid currentColor; border-radius: 4px; padding: 0 0.4rem; font-size: 12px; white-space: nowrap; }
    .badge-ok { color: #157f3c; }
    .badge-unavailable { color: #b3261e; }
  </style>
</head>
<body>
  <header>
    <h1>LoadCoach</h1>
    <nav aria-label="Primary">
      <ul>
        <li><a href="/models" {% if page == 'models' %}aria-current="page"{% endif %}>Models</a></li>
        <li><a href="/task-profiles" {% if page == 'task-profiles' %}aria-current="page"{% endif %}>Task profiles</a></li>
        <li><a href="/routing" {% if page == 'routing' %}aria-current="page"{% endif %}>Routing</a></li>
      </ul>
    </nav>
  </header>
  <main id="content">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
