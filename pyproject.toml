[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "loadcoach"
description = "Turns FreeWeight's measurements (or declared capabilities) into routed, queued, validated inference execution with a fully explainable decision for every job."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dynamic = ["version"]
authors = [{ name = "Local AI Suite contributors" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
# This repository originates weightsdb (Phase 1) and mirrorwall (Phase 4) as extractions; both packages are consumed from those phases onward.
dependencies = [
    "baseaicore>=0.4,<0.5",
    "setspec>=0.4,<0.5",
    "modelrack>=0.5,<0.6",
    "sweatmeter>=0.4,<0.5",
    "weightsdb>=0.2,<0.3",
    "mirrorwall>=0.2,<0.3",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.4,<3",
    "sqlalchemy>=2.0.30,<3",
    "alembic>=1.13,<2",
    "typer>=0.12,<1",
    "jinja2>=3.1,<4",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
    # >=9.0.3 excludes PYSEC-2026-1845 (vulnerable /tmp/pytest-of-{user} handling,
    # affecting pytest through 9.0.2). Matches the pin BaseAiCore, SetSpec, ModelRack,
    # SweatMeter, WeightsDB and MirrorWall all carry.
    "pytest>=9.0.3,<10",
    "pytest-cov>=5,<6",
    "pytest-randomly>=3,<4",
    "mypy>=1.11,<2",
    "ruff>=0.6,<1",
    "import-linter>=2.0,<3",
    "respx>=0.21,<1",
]
postgres = [
    "psycopg[binary]>=3.2,<4",
]

[project.urls]
Homepage = "https://github.com/JPKell/LoadCoach"
Documentation = "https://github.com/JPKell/LoadCoach/tree/main/docs"
Changelog = "https://github.com/JPKell/LoadCoach/blob/main/CHANGELOG.md"

[project.scripts]
loadcoach = "loadcoach.cli.main:app"

[tool.hatch.version]
path = "src/loadcoach/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/loadcoach"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "T20", "DTZ", "PTH", "D1", "BLE"]
ignore = ["D100", "D104"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D1"]
# Alembic-generated: upgrade()/downgrade() carry no behaviour beyond the revision's own docstring,
# and their bodies are op.* DDL calls Alembic itself generated, not hand-written business logic.
"src/loadcoach/infrastructure/db/migrations/versions/*.py" = ["D1"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
mypy_path = "src"
explicit_package_bases = true

[tool.pytest.ini_options]
addopts = "-m 'not live and not performance'"
markers = [
    "live: requires a real provider/GPU, never in default CI",
    "performance: performance budget assertions, excluded by default",
    "contract: public API/schema conformance in both directions",
]
testpaths = ["tests"]

[tool.coverage.run]
# The **importable package**, not the source path. CI installs the built distribution
# (`pip install . --no-deps`) rather than an editable checkout, and a path-based source measures
# nothing against a non-editable install: every test passes, and the gate fails with 0 % — a
# number that looks like a catastrophe instead of a configuration error.
source = ["loadcoach"]
branch = true

[tool.coverage.paths]
# Maps the installed package back onto the checkout, so a report produced against site-packages
# names files a reader can open.
source = ["src/loadcoach", "*/site-packages/loadcoach"]

[tool.coverage.report]
fail_under = 85
show_missing = true
